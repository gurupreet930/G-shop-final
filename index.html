<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Shop | Premium Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .nav-top { background-color: #131921; }
        .amazon-yellow { background-color: #febd69; }
        .checkout-modal { background: rgba(0,0,0,0.7); }
    </style>
</head>
<body class="bg-[#eaeded] font-sans text-sm">

    <header class="nav-top text-white p-2">
        <div class="max-w-[1500px] mx-auto flex items-center gap-4">
            <div class="text-2xl font-bold p-1 border border-transparent hover:border-white cursor-pointer flex items-center gap-1">
                <span class="bg-orange-500 p-1 rounded text-sm text-black">G</span> G-Shop
            </div>
            <div class="flex-1 flex shadow-sm">
                <select class="bg-gray-100 text-black p-2 rounded-l-sm text-xs hidden md:block border-r">
                    <option>All Products</option>
                </select>
                <input type="text" class="w-full p-2 text-black outline-none" placeholder="Search G-Shop...">
                <button class="amazon-yellow p-2 px-5 rounded-r-sm text-black hover:bg-[#f3a847]">
                    <i class="fa fa-search"></i>
                </button>
            </div>
            <div class="flex gap-4 font-bold items-center">
                <div class="p-1 border border-transparent hover:border-white cursor-pointer leading-tight">
                    <p class="text-[10px] font-normal">Hello, Gurpreet</p>
                    <p>Account & Lists</p>
                </div>
                <div class="p-1 border border-transparent hover:border-white cursor-pointer relative">
                    <i class="fa fa-shopping-cart text-2xl"></i> Cart
                </div>
                <a href="admin.html" class="text-orange-400 border border-orange-400 px-2 py-1 rounded hover:bg-orange-400 hover:text-black transition">Admin Panel</a>
            </div>
        </div>
    </header>

    <main class="max-w-[1500px] mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
            
            <div class="bg-white p-4 shadow flex flex-col justify-between">
                <div>
                    <span class="bg-orange-600 text-white text-[10px] px-2 py-1 font-bold">HOT DEAL</span>
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="h-48 w-full object-contain my-2">
                    <h3 class="font-bold text-gray-800">Elite Wireless Pods Pro</h3>
                    <p class="text-orange-600 font-bold">$ 89.99</p>
                </div>
                <div class="mt-4 space-y-2">
                    <button class="w-full bg-orange-500 py-2 rounded text-white font-bold hover:bg-orange-600">Add to Cart</button>
                    <button onclick="openCheckout('Elite Wireless Pods Pro', '89.99')" class="w-full bg-yellow-400 py-2 rounded font-bold hover:bg-yellow-500">Buy Now</button>
                </div>
            </div>

            <div class="bg-white p-4 shadow flex flex-col justify-between">
                <div>
                    <span class="bg-blue-600 text-white text-[10px] px-2 py-1 font-bold">TOP SELLER</span>
                    <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=400" class="h-48 w-full object-contain my-2">
                    <h3 class="font-bold text-gray-800">UltraSlim 4K Dash Cam</h3>
                    <p class="text-orange-600 font-bold">$ 119.99</p>
                </div>
                <button onclick="openCheckout('UltraSlim 4K Dash Cam', '119.99')" class="w-full bg-yellow-400 py-2 rounded font-bold mt-4">Buy Now</button>
            </div>
        </div>
    </main>

    <div id="checkoutModal" class="fixed inset-0 checkout-modal hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded shadow-2xl relative overflow-hidden">
            <button onclick="closeCheckout()" class="absolute top-2 right-4 text-2xl">&times;</button>
            <div class="p-6 border-b">
                <h2 class="text-xl font-bold">Checkout</h2>
                <p class="text-xs text-gray-500" id="buying-item">Purchasing: product</p>
            </div>
            <form class="p-6 space-y-4" onsubmit="handleOrder(event)">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500">Full Name</label>
                    <input type="text" class="w-full border p-2 rounded outline-orange-500" placeholder="John Doe" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500">Email Address</label>
                    <input type="email" class="w-full border p-2 rounded outline-orange-500" placeholder="john@example.com" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500">Shipping Address</label>
                    <input type="text" class="w-full border p-2 rounded outline-orange-500" placeholder="123 Main St, New York, NY 10001" required>
                </div>
                <div class="bg-gray-100 p-4 rounded text-sm space-y-1">
                    <div class="flex justify-between"><span>Items:</span><span id="price-display">$0.00</span></div>
                    <div class="flex justify-between text-green-600 font-bold"><span>Shipping:</span><span>FREE</span></div>
                    <div class="flex justify-between text-lg font-bold border-t pt-2 mt-2"><span>Order Total:</span><span id="total-display">$0.00</span></div>
                </div>
                <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold text-lg hover:bg-orange-600 transition shadow-lg">Place Your Order</button>
            </form>
        </div>
    </div>

    <script>
        function openCheckout(item, price) {
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('buying-item').innerText = "Purchasing: " + item;
            document.getElementById('price-display').innerText = "$" + price;
            document.getElementById('total-display').innerText = "$" + price;
        }
        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }
        function handleOrder(e) {
            e.preventDefault();
            alert("Order automation triggered! Forwarding data...");
            // Yahan hum Auto-order ka system jodeinge
        }
    </script>
</body>
  </html>
