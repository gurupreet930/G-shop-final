<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com | Shop Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .amazon-gradient { background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(234,237,237,1) 100%); }
    </style>
</head>
<body class="bg-[#eaeded] font-sans">

    <header class="bg-[#131921] text-white">
        <div class="flex items-center p-2 gap-4">
            <div class="border border-transparent hover:border-white p-1 cursor-pointer">
                <span class="text-2xl font-bold text-white">amazon<span class="text-orange-400 text-lg">.in</span></span>
            </div>
            
            <div class="flex-1 flex items-center">
                <select class="bg-gray-200 text-black p-2 rounded-l border-none text-sm outline-none cursor-pointer">
                    <option>All</option>
                </select>
                <input type="text" class="w-full p-2 text-black outline-none" placeholder="Search Amazon.in">
                <button class="bg-[#febd69] p-2 rounded-r px-5 text-black hover:bg-[#f3a847]">
                    <i class="fa fa-search text-xl"></i>
                </button>
            </div>

            <div class="flex gap-4 items-center text-sm">
                <div class="border border-transparent hover:border-white p-1 cursor-pointer">
                    <p class="text-xs">Hello, Sign in</p>
                    <p class="font-bold">Account & Lists</p>
                </div>
                <div class="border border-transparent hover:border-white p-1 cursor-pointer">
                    <p class="text-xs">Returns</p>
                    <p class="font-bold">& Orders</p>
                </div>
                <div class="flex items-center font-bold text-lg cursor-pointer">
                    <i class="fa fa-shopping-cart text-2xl mr-1"></i> Cart
                </div>
            </div>
        </div>
        <div class="bg-[#232f3e] p-2 flex gap-4 text-sm font-medium overflow-x-auto whitespace-nowrap">
            <span class="hover:border border-white p-1 cursor-pointer">Best Sellers</span>
            <span class="hover:border border-white p-1 cursor-pointer">Mobiles</span>
            <span class="hover:border border-white p-1 cursor-pointer">Electronics</span>
            <span class="hover:border border-white p-1 cursor-pointer">Customer Service</span>
            <a href="admin.html" class="bg-orange-500 text-black px-2 rounded font-bold">Admin Panel</a>
        </div>
    </header>

    <main class="relative">
        <div class="h-[400px] bg-[url('https://m.media-amazon.com/images/I/61zAjw4bqPL._SX3000_.jpg')] bg-cover bg-center">
            <div class="amazon-gradient h-full"></div>
        </div>

        <div class="max-w-[1500px] mx-auto -mt-40 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 px-4 relative z-10">
            
            <div class="bg-white p-5 shadow-md">
                <h2 class="text-xl font-bold mb-2">Up to 70% off | Electronics</h2>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="w-full h-64 object-contain mb-4">
                <div class="text-sm text-gray-800">
                    <span class="bg-red-700 text-white px-2 py-1 text-xs font-bold">Limited time deal</span>
                    <p class="text-2xl mt-1 font-semibold">$89.99 <span class="text-sm text-gray-500 font-normal line-through">$129.99</span></p>
                </div>
                <button class="w-full bg-[#ffd814] hover:bg-[#f7ca00] py-2 mt-4 rounded-full shadow-md font-medium border border-[#fcd200]">Add to Cart</button>
                <button class="w-full bg-[#ffa41c] hover:bg-[#fa8914] py-2 mt-2 rounded-full shadow-md font-medium border border-[#ee9109]">Buy Now</button>
            </div>

            <div class="bg-white p-5 shadow-md">
                <h2 class="text-xl font-bold mb-2">Bestseller | Dash Cams</h2>
                <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=400" class="w-full h-64 object-contain mb-4">
                <div class="text-sm text-gray-800">
                    <span class="bg-red-700 text-white px-2 py-1 text-xs font-bold">Best Seller</span>
                    <p class="text-2xl mt-1 font-semibold">$119.99 <span class="text-sm text-gray-500 font-normal line-through">$199.00</span></p>
                </div>
                <button class="w-full bg-[#ffd814] hover:bg-[#f7ca00] py-2 mt-4 rounded-full shadow-md font-medium">Add to Cart</button>
                <button class="w-full bg-[#ffa41c] hover:bg-[#fa8914] py-2 mt-2 rounded-full shadow-md font-medium">Buy Now</button>
            </div>

        </div>
    </main>

</body>
</html>
