<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Shop Admin | Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <div class="flex justify-between items-center mb-10 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-orange-500"><i class="fa fa-user-shield mr-2"></i>G-Shop Admin</h1>
            <a href="index.html" class="text-gray-400 hover:text-white underline text-sm">View Website</a>
        </div>

        <div class="grid gap-6">
            <div class="bg-gray-800 p-5 rounded-lg border-l-4 border-orange-500 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=100" class="w-16 h-16 rounded object-cover">
                    <div>
                        <h2 class="font-bold text-lg">Elite Wireless Pods Pro</h2>
                        <p class="text-gray-400 text-sm">ID: #001</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <label class="text-xs text-gray-500 block uppercase">Price ($)</label>
                        <input type="number" value="89.99" class="bg-gray-700 border border-gray-600 rounded p-2 w-24 text-center text-orange-400 font-bold outline-none focus:border-orange-500">
                    </div>
                    <button class="bg-orange-500 hover:bg-orange-600 text-black font-bold py-2 px-6 rounded transition mt-4">Update</button>
                </div>
            </div>

            <div class="bg-gray-800 p-5 rounded-lg border-l-4 border-orange-500 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=100" class="w-16 h-16 rounded object-cover">
                    <div>
                        <h2 class="font-bold text-lg">UltraSlim 4K Dash Cam</h2>
                        <p class="text-gray-400 text-sm">ID: #002</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <label class="text-xs text-gray-500 block uppercase">Price ($)</label>
                        <input type="number" value="119.99" class="bg-gray-700 border border-gray-600 rounded p-2 w-24 text-center text-orange-400 font-bold outline-none focus:border-orange-500">
                    </div>
                    <button class="bg-orange-500 hover:bg-orange-600 text-black font-bold py-2 px-6 rounded transition mt-4">Update</button>
                </div>
            </div>
        </div>

        <div class="mt-10 p-4 bg-orange-500/10 border border-orange-500/30 rounded text-sm text-orange-200">
            <i class="fa fa-info-circle mr-2"></i> <b>Tip:</b> Update prices here to reflect instantly on the live storefront.
        </div>
    </div>
</body>
</html>
